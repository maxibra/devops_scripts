---
default_stages:
  - commit-msg
  - pre-commit
fail_fast: false
minimum_pre_commit_version: 2.15.0

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Git hooks
      - id: check-added-large-files
        args:
          - --maxkb=2000
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: forbid-submodules
      - id: no-commit-to-branch
        args:
          - --branch
          - main

      # Common errors
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace
        args:
          - "--markdown-linebreak-ext=md,markdown,mdown,mkd"

      # JSON
      - id: check-json
      - id: pretty-format-json
        args:
          - --autofix
          - --indent=2
          - --no-ensure-ascii

      # Cross platform
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: destroyed-symlinks
      - id: mixed-line-ending
        args:
          - --fix=lf

      # Security
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: detect-private-key

  # Conventional Commits
  # pre-commit install -t pre-commit -t commit-msg
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 5c3f3c61b143a94e9ab5d767ff4d0dc9d6801aa3 # v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
        args:
          - --verbose
          - breaking change
          - build
          - chore
          - ci
          - docs
          - feat
          - feature
          - fix
          - major change
          - perf
          - refactor
          - revert
          - style
          - test

  # Terraform
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 18cead24f7d3df230683a008aaf903f43e8457d6 # v1.102.0
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive
          - --args=-diff
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=SPECS.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
        exclude: modules/gcp/

  - repo: local
    hooks:
      - id: tfsort
        name: tfsort
        entry: hooks/tfsort.sh
        language: script
        exclude: |
          (?x)^(
            modules/gcp/.*
          )$
        types:
          - terraform

  # Gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: 4fb43823ef3d152d239e92d7d5cb04783b548062 # v8.28.0
    hooks:
      - id: gitleaks

  # YAML
  - repo: https://github.com/google/yamlfmt
    rev: a48496e0c7da8d230a02133b8eef684d0df74208 # v0.18.0
    hooks:
      - id: yamlfmt
        pass_filenames: false

  - repo: https://github.com/adrienverge/yamllint
    rev: 79a6b2b1392eaf49cdd32ac4f14be1a809bbd8f7 # v1.37.1
    hooks:
      - id: yamllint
        args:
          - -c=.yamllint.yml
